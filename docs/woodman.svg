<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Woodman, a walking log with a twig on his head">
  <rect width="128" height="128" rx="24" fill="#9bd14b"/>
  <ellipse cx="68" cy="116" rx="36" ry="7" fill="#5e9a2c"/>
  <!-- boots -->
  <rect x="42" y="98" width="16" height="16" rx="4" fill="#14231c"/>
  <rect x="70" y="98" width="16" height="16" rx="4" fill="#14231c"/>
  <!-- arms -->
  <rect x="38" y="52" width="6" height="40" rx="3" fill="#a9561f"/>
  <rect x="84" y="52" width="6" height="40" rx="3" fill="#a9561f"/>
  <!-- log body -->
  <path d="M44 28h40v72a20 7 0 0 1-40 0Z" fill="#c06a28"/>
  <path d="M44 28h12v76a20 7 0 0 1-12-3Z" fill="#a9561f" opacity=".55"/>
  <!-- cut top -->
  <ellipse cx="64" cy="28" rx="22" ry="8" fill="#f1d98b"/>
  <ellipse cx="64" cy="28" rx="13" ry="4.5" fill="#d99a3a"/>
  <ellipse cx="64" cy="28" rx="6" ry="2.2" fill="#f1d98b"/>
  <!-- twig -->
  <path d="M68 26 90 12" stroke="#a9561f" stroke-width="5" stroke-linecap="round"/>
  <!-- hands -->
  <circle cx="41" cy="62" r="3.2" fill="#f2a27a"/>
  <circle cx="87" cy="62" r="3.2" fill="#f2a27a"/>
  <!-- face -->
  <ellipse cx="55" cy="50" rx="4" ry="4.6" fill="#1a1210"/>
  <ellipse cx="73" cy="50" rx="4" ry="4.6" fill="#1a1210"/>
  <circle cx="54" cy="48.5" r="1.2" fill="#fff"/>
  <circle cx="72" cy="48.5" r="1.2" fill="#fff"/>
  <path d="M59 62h10" stroke="#3b1d0c" stroke-width="2" stroke-linecap="round"/>
</svg>
